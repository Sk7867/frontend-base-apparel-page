<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./style.css">
  
  <title>Frontend Mentor | Base Apparel coming soon page</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <div class="base_apperal_container">
    <div class="container_top">
      <div class="mobile_logo_conatiner">
        <img src="./images/logo.svg" alt="Base Apperal Logo">
      </div>
      <div class="mobile_model_image_container">
        <img src="./images/hero-mobile.jpg" alt="Beautiful Model in Mobile View">
      </div>
    </div>
    <div class="container_left">
      <div class="desktop_logo_conatiner">
        <img src="./images/logo.svg" alt="Base Apperal Logo">
      </div>
      <div class="container_heading">
        <h1>
          <span class="text_highlight josefin-sans-300">We're</span>
          <span class="josefin-sans-600">coming</span>
          <span class="josefin-sans-600">soon</span>
        </h1>
      </div>
      <p class="container_description josefin-sans-400">
        Hello fellow shoppers! We're currently building our new fashion store. 
  Add your email below to stay up-to-date with announcements and our launch deals.
      </p>
      <form class="sign_up_form" id="form">
        <label class="sign_up_form_label" for="email" hidden>Email Address</label>
        <input id="form_input" class="sign_up_form_input" placeholder="Email Address" type="email" id="email" name="email" aria-describedby="email-error" maxlength="255" required>
        <p class="form_error josefin-sans-300">Enter Valid Email Address</p>
        <div class="sign_up_form_submit_container">
          <img class="form_error" src="./images/icon-error.svg" alt="">
          <button id="form_submit" type="submit" class="sign_up_form_button">
            <img src="./images/icon-arrow.svg" alt="Form Submit Button">
          </button>
        </div>
      </form>
    </div>
  </div>
    

  
  <footer class="sticky_footer">
    <p class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
      Coded by <a href="#">Your Name Here</a>.
    </p>
  </footer>
  <script src="./form_validation.js"></script>
</body>
</html>
